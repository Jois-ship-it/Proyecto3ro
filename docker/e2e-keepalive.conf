# SOLO para el entorno aislado de las pruebas de punta a punta (docker-compose.e2e.yml). No va en la imagen ni en el stack normal.
#
# Apache cierra una conexión persistente que lleva 5 segundos sin usarse (KeepAliveTimeout por defecto). El proxy de Cypress la sigue
# reutilizando para el pedido siguiente: en una máquina cargada, o al empezar cada especificación, pasan más de 5 segundos entre un
# pedido y otro y ese pedido —casi siempre el primer POST de resultados— queda colgado hasta que Cypress se rinde. Con este valor la
# conexión sigue abierta y el problema no aparece. En producción el valor de siempre es el correcto: un navegador real reabre solo.
KeepAliveTimeout 300
