name: flexarena

services:
  app:
    build: .
    container_name: flexarena_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www/flexarena:z
      - flexarena_apache_logs:/var/log/apache2
      # Estado del contenedor entre reinicios (marca de datos de demostracion
      # ya cargados). Se borra con `docker compose down -v`, que es lo que hace
      # que una instalacion desde cero vuelva a sembrar.
      - flexarena_estado:/var/lib/flexarena
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-flexarena}
      - DB_USER=${DB_USER:-flexarena_user}
      - DB_PASS=${DB_PASS:-change_this_db_password}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - HTTPS_PORT=${HTTPS_PORT:-443}
      # Credencial de ADMINISTRACION de la base. La usa SOLO docker-entrypoint.sh,
      # al arrancar: para dejar al usuario de la app con el minimo privilegio
      # (database/aplicar_privilegios.php) y para sembrar los datos de demostracion
      # (seed_demo.php hace TRUNCATE, que la app ya no puede). El entrypoint la
      # borra del entorno antes de lanzar Apache: el codigo web nunca la ve.
      - DB_ROOT_PASS=${DB_ROOT_PASS:-change_this_root_password}
      # Contrasenas iniciales de las cuentas del seed (database/inicializar_cuentas.php).
      # seed.sql no trae ninguna: sin estas dos, el administrador recibe una clave al
      # azar (se imprime una vez en el log) y las cuentas de demostracion quedan sin
      # clave. Tambien se borran del entorno antes de lanzar Apache.
      - ADMIN_PASS=${ADMIN_PASS:-}
      - DEMO_PASS=${DEMO_PASS:-}
      # Carga database/seed_demo.php en la PRIMERA inicialización (cuando la
      # base todavía no tiene torneos). Poner 0 para arrancar solo con lo que
      # traen schema.sql y seed.sql.
      - SEED_DEMO=${SEED_DEMO:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flexarena_net

  db:
    image: mysql:8.0
    container_name: flexarena_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-change_this_root_password}
      MYSQL_DATABASE:      ${DB_NAME:-flexarena}
      MYSQL_USER:          ${DB_USER:-flexarena_user}
      MYSQL_PASSWORD:      ${DB_PASS:-change_this_db_password}
      TZ:                  America/Argentina/Buenos_Aires
    # Sin "ports": no se publica al host, solo accesible dentro de flexarena_net (por app y pma).
    volumes:
      - flexarena_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro,z
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro,z
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=America/Argentina/Buenos_Aires
    healthcheck:
      # Por TCP (-h 127.0.0.1) y contra una tabla del esquema, a proposito:
      #  - El servidor TEMPORAL que la imagen levanta para correr los scripts de
      #    /docker-entrypoint-initdb.d escucha solo por socket. Un ping por
      #    socket lo da por sano y 'app' arranca sobre una base sin tablas.
      #  - Consultar `roles` garantiza ademas que schema.sql y seed.sql ya
      #    terminaron, no solo que hay un servidor escuchando.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1 FROM roles LIMIT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # La primera inicializacion (crear el datadir + cargar schema y seed) es lenta en
      # una maquina con disco lento: el esquema crea 21 tablas, 5 vistas y 51 triggers, y
      # cada sentencia DDL espera un fsync. Medido en una PC con Docker sobre Windows:
      # unos 6 minutos desde cero. Mientras dura el start_period los fallos del healthcheck
      # no cuentan y el primer exito ya da la base por sana, asi que un valor holgado no
      # demora un arranque normal. Con menos de lo que tarda, 'docker compose up -d' falla
      # con "dependency failed to start" la primerisima vez y hay que reintentar a mano.
      start_period: 600s
    networks:
      - flexarena_net

  pma:
    image: phpmyadmin/phpmyadmin:latest
    container_name: flexarena_pma
    restart: unless-stopped
    ports:
      # Solo en 127.0.0.1, a propósito: phpMyAdmin es una consola de administración de
      # la base y sin esto escucha en TODAS las interfaces, o sea que cualquiera en la
      # red con una contraseña adivinada (o un día cero de phpMyAdmin) llega a los datos.
      # Desde la propia máquina anda igual (http://localhost:8081). Para usarlo contra un
      # servidor, un túnel SSH: ssh -L 8081:127.0.0.1:8081 usuario@servidor
      - "127.0.0.1:${PMA_HTTP_PORT:-8081}:80"
    environment:
      # Sin PMA_USER/PMA_PASSWORD a propósito: con esas variables, phpMyAdmin
      # usa auth_type "config" y AUTO-loguea a cualquiera que llegue al puerto,
      # sin pedir usuario/contraseña — quien acceda a este puerto tendría
      # control total de la base sin ningún desafío. Sin ellas, usa el modo
      # por defecto ("cookie"): pide login real en cada acceso.
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flexarena_net

volumes:
  flexarena_mysql_data:
    name: flexarena_mysql_data
  flexarena_apache_logs:
    name: flexarena_apache_logs
  flexarena_estado:
    name: flexarena_estado

networks:
  flexarena_net:
    name: flexarena_net
    driver: bridge
